[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkevitune"
version = "1.0.0"
description = "Evidence-aware, human-controlled Apache Spark configuration guidance with gated ML"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Moulay Youssef ICHAHANE", email = "ichahane.m@ucd.ac.ma"},
  {name = "Ahmed Dourhri"},
  {name = "Mohamed Hanine"}
]
keywords = ["apache-spark", "configuration-guidance", "event-logs", "evidence-aware", "machine-learning", "abstention"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.31", "plotly>=5.18"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]
benchmark = ["pyspark>=3.5,<4"]

[project.scripts]
sparkevitune-analyze = "sparkevitune.cli:analyze_main"
sparkevitune-train = "sparkevitune.cli:train_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
